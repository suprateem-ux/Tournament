name: Send Team Message

on:
  workflow_dispatch: # run manually

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Send team-wide private message
        run: |
          curl -X POST "https://lichess.org/team/international-chess-talent/pm-all" \
            -H "Authorization: Bearer ${{ secrets.LICHESS_KEY }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "message=$(cat msg.txt)"
